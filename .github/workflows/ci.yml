name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aetheria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aetheria"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from `packageManager` in package.json (pnpm@10.32.1).
      # Don't specify `version:` here — having both is a fatal conflict in v4.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Prepare test environment
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aetheria?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/aetheria?schema=public"
          JWT_SECRET: "ci-test-secret-not-used-in-prod-x9k2p1"
        run: |
          cd packages/server
          echo "DATABASE_URL=$DATABASE_URL" > .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          pnpm exec prisma generate
          pnpm exec prisma db push --skip-generate

      - name: Build shared (emit .d.ts for downstream typecheck)
        run: pnpm --filter @game/shared build

      - name: Type-check shared
        run: cd packages/shared && pnpm exec tsc --noEmit

      - name: Type-check server
        run: cd packages/server && pnpm exec tsc --noEmit

      - name: Type-check client
        run: cd packages/client && pnpm exec tsc --noEmit

      - name: Test server
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/aetheria?schema=public"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/aetheria?schema=public"
          JWT_SECRET: "ci-test-secret-not-used-in-prod-x9k2p1"
        run: cd packages/server && pnpm test

      - name: Test shared
        run: cd packages/shared && pnpm test

      - name: Build client
        run: cd packages/client && pnpm exec vite build
